name: Upload PDF to Internet Archive

on:
  push:
    paths:
      - "pdf/**/*.pdf"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Internet Archive CLI
        run: |
          python -m pip install --upgrade pip
          pip install internetarchive

      - name: Upload PDFs to Archive.org
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          find pdf -type f -name "*.pdf" -print0 | while IFS= read -r -d '' file
          do
            echo "Uploading: $file"

            ia upload "${{ secrets.IA_ITEM_ID }}" "$file" \
              --metadata="mediatype:texts" \
              --metadata="collection:community_texts"
          done
